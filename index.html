// ─── INPUT ────────────────────────────────────────────────────────────────────
const keys = {};
const justPressed = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function consumeKey(code) {
  const v = justPressed[code];
  justPressed[code] = false;
  return v;
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
const particles = [];

function spawnStompParticles(x, y) {
  for (let i = 0; i < 18; i++) {
    const angle = -Math.PI + Math.random() * Math.PI;
    const s = 2 + Math.random() * 6;
    const hue = Math.random()*360;
    particles.push({ x, y, vx: Math.cos(angle)*s, vy: Math.sin(angle)*s-2,
      life:32, maxLife:32, color:`hsl(${hue},100%,70%)`, size:2+Math.random()*5 });
  }
}

function spawnFireballHit(x, y) {
  for (let i = 0; i < 22; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 7;
    particles.push({ x, y, vx: Math.cos(angle)*s, vy: Math.sin(angle)*s,
      life:36, maxLife:36, color:`hsl(${15+Math.random()*40},100%,${50+Math.random()*35}%)`, size:2+Math.random()*6 });
  }
}

function spawnMuzzleFlash(x, y, dir) {
  for (let i = 0; i < 12; i++) {
    const spread = (Math.random()-0.5)*2;
    const s = 3 + Math.random()*6;
    particles.push({ x, y, vx: dir*s+spread*0.5, vy: spread,
      life:16, maxLife:16, color:`hsl(${25+Math.random()*25},100%,${60+Math.random()*30}%)`, size:2+Math.random()*3 });
  }
}

function spawnHitParticles(x, y) {
  for (let i = 0; i < 14; i++) {
    const angle = Math.random()*Math.PI*2;
    particles.push({ x, y, vx: Math.cos(angle)*3, vy: Math.sin(angle)*3-1,
      life:22, maxLife:22, color:`hsl(${180+Math.random()*60},100%,80%)`, size:2+Math.random()*3 });
  }
}

function spawnBossHit(x, y) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.random()*Math.PI*2;
    const s = 2+Math.random()*8;
    const hue = Math.random()*360;
    particles.push({ x, y, vx:Math.cos(angle)*s, vy:Math.sin(angle)*s-2,
      life:50, maxLife:50, color:`hsl(${hue},100%,65%)`, size:3+Math.random()*6 });
  }
}

function updateParticles() {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x-cameraX, p.y, p.size*(p.life/p.maxLife), 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ─── SCREEN SHAKE ─────────────────────────────────────────────────────────────
function shake(frames, intensity) {
  shakeFrames = Math.max(shakeFrames, frames);
  shakeIntensity = Math.max(shakeIntensity, intensity);
}

// Active level set
function getLevelSet() {
  if (currentQuest===1) return LEVELS;
  if (currentQuest===2) return LEVELS_Q2;
  return LEVELS_Q3;
}

// ─── BOSS STATE ───────────────────────────────────────────────────────────────
let boss = null;
const BOSS_MAX_HP = 6;

function createBoss(type='eggbot') {
  return {
    x: 580, y: 310, w: 80, h: 100,
    vx: -2.5, vy: 0,
    hp: BOSS_MAX_HP,
    alive: true,

}

function createPlayer() {
  return {
    x:60, y:360, w:28, h:40,
    vx:0, vy:0,
    onGround:false,
    facing:1,
    coyoteTime:0,
    jumpBuffer:0,
    invincible:0,
    fireballCooldown:0,
    walkFrame:0,
    walkTimer:0,
    alive:true,
  };
}

function createEnemy(def) {
  return {
    x:def.x, y:def.y-40, w:32, h:40,
    vx:def.speed, vy:0,
    onGround:false,
    alive:true,

    speed:def.speed,
    wobble:Math.random()*Math.PI*2,
    secret: def.secret || false,

}

// ─── LOAD LEVEL ───────────────────────────────────────────────────────────────
function loadLevel(idx) {
  const def = getLevelSet()[idx];
  platforms = def.platforms.map(p=>({...p}));
  enemies   = def.enemies.map(e=>createEnemy(e));
  fireballs = [];
  particles.length = 0;
  secretUsed = false;
  resetSecretTrackers();
  cameraX = 0;
  levelW  = def.levelW;
  goal    = {...def.goal};
  powerUp = (def.powerUp && !hasPower) ? {...def.powerUp, collected:false} : null;
  heartPickup = def.heart ? {...def.heart, collected:false} : null;
  player  = createPlayer();
  boss    = null;
  if (def.isBoss) {
    boss = createBoss(def.bossType || 'eggbot');
    document.getElementById('boss-health-bar').style.display = 'block';
    document.getElementById('boss-health-label').textContent =
      def.bossType === 'metalRook' ? '⚠ METAL ROOK ⚠' :
      def.bossType === 'fists'     ? '⚠ FISTS ⚠' : '⚠ DR. EGGBOT ⚠';
    updateBossHealthBar();
  } else {
    document.getElementById('boss-health-bar').style.display = 'none';
  }
  updateUI();
}

function updateBossHealthBar() {
  const pct = boss ? (boss.hp / BOSS_MAX_HP * 100) : 0;
  document.getElementById('boss-health-fill').style.width = pct + '%';
}

// ─── COLLISION ────────────────────────────────────────────────────────────────
function overlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function resolvePlatforms(obj) {
  obj.onGround = false;
  for (const p of platforms) {
    if (!overlap(obj, p)) continue;
    const ox = Math.min(obj.x+obj.w, p.x+p.w) - Math.max(obj.x, p.x);
    const oy = Math.min(obj.y+obj.h, p.y+p.h) - Math.max(obj.y, p.y);
    if (ox > oy) {
      if (obj.y+obj.h/2 < p.y+p.h/2) {
        obj.y = p.y-obj.h; if (obj.vy > 0) obj.vy = 0; obj.onGround = true;
      } else {
        obj.y = p.y+p.h; if (obj.vy < 0) obj.vy = 0;
      }
    } else {
      if (obj.x+obj.w/2 < p.x+p.w/2) obj.x = p.x-obj.w;
      else obj.x = p.x+p.w;
      obj.vx = (obj === player) ? 0 : -obj.vx;
    }
  }
}

// ─── PHYSICS CONSTANTS ────────────────────────────────────────────────────────
const GRAVITY   = 0.6;
const JUMP_FORCE= -14;
const SPEED     = 6.8;
const MAX_FALL  = 18;

// ─── UPDATE PLAYER ────────────────────────────────────────────────────────────
function updatePlayer() {
  if (!player.alive) return;
  if (player.invincible > 0) player.invincible--;
  if (player.fireballCooldown > 0) player.fireballCooldown--;

  if (player.onGround) player.coyoteTime = 8;
  else if (player.coyoteTime > 0) player.coyoteTime--;

  if (consumeKey('Space')||consumeKey('ArrowUp')||consumeKey('KeyW')) player.jumpBuffer = 10;
  if (player.jumpBuffer > 0) player.jumpBuffer--;

  player.vx = 0;
  if (keys['ArrowLeft']||keys['KeyA'])  { player.vx=-SPEED; player.facing=-1; }
  if (keys['ArrowRight']||keys['KeyD']) { player.vx= SPEED; player.facing= 1; }

  if (player.jumpBuffer > 0 && player.coyoteTime > 0) {
    player.vy = JUMP_FORCE;
    player.coyoteTime = 0;
    player.jumpBuffer = 0;
    // Jump counter secret (Q2-L2)
    secretJumpCount++;
    if (currentQuest===2 && currentLevel===1 && secretJumpCount>=15) checkSecret('jump15');
  }

  if (player.vy < 0 && !(keys['Space']||keys['ArrowUp']||keys['KeyW'])) player.vy += 0.35;

  player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(0, Math.min(player.x, levelW - player.w));

  if (player.y > H + 120) { playerFallDie(); return; }

  resolvePlatforms(player);

  // Reset stomp combo when landing normally (not via stomp bounce)
  if (player.onGround && player.vy === 0) secretStompCombo = 0;

  if (player.vx !== 0 && player.onGround) {
    if (++player.walkTimer > 7) { player.walkTimer=0; player.walkFrame=(player.walkFrame+1)%4; }
  } else { player.walkFrame=0; }

  if (hasPower && player.fireballCooldown===0 && (consumeKey('KeyZ')||consumeKey('KeyX'))) {
    shootFireball();
  }

  updateSecretTrackers();
}

function shootFireball() {
  const fx = player.facing===1 ? player.x+player.w+2 : player.x-2;
  const fy = player.y + player.h*0.38;
  fireballs.push({ x:fx, y:fy, vx:player.facing*9, vy:-0.5, bounces:2, alive:true, trail:[] });
  spawnMuzzleFlash(fx+cameraX, fy, player.facing);
  for (let i=0;i<10;i++) {
    const spread=(Math.random()-0.5)*2;
    const s=3+Math.random()*5;
    particles.push({x:fx,y:fy,vx:player.facing*s+spread*0.4,vy:spread,
      life:14,maxLife:14,color:`hsl(${25+Math.random()*25},100%,${60+Math.random()*30}%)`,size:2+Math.random()*3});
  }
  shake(4,2);
  player.fireballCooldown = 18;
}

// ─── UPDATE ENEMIES ───────────────────────────────────────────────────────────
function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;

    if (e.dying) {
      e.dyingTimer--;
      e.vy += GRAVITY;
      e.y += e.vy;
      if (e.dyingTimer <= 0) e.alive = false;
      continue;
    }

    e.vy = Math.min(e.vy + GRAVITY, MAX_FALL);
    e.x += e.vx;
    e.y += e.vy;
    e.wobble += 0.07;

    const checkX = e.vx>0 ? e.x+e.w+3 : e.x-3;
    let overEdge = true;
    for (const p of platforms) {
      if (checkX>=p.x && checkX<=p.x+p.w && Math.abs(e.y+e.h-p.y)<24) { overEdge=false; break; }
    }
    if (overEdge && e.onGround) e.vx *= -1;

    if (e.y > H+120) { e.alive=false; continue; }

    resolvePlatforms(e);

    if (player.alive && player.invincible===0 && overlap(player, e)) {
      const fromAbove = player.vy>0 && (player.y+player.h) < (e.y+e.h*0.55);
      if (fromAbove) { stompEnemy(e); player.vy = -7.5; }
      else if (e.secret) {
        // Secret green egg — warp, no damage
        checkSecret('hit');
      } else {
        // Q2-L5 glitch warp triggers on any enemy side-hit
        if (currentQuest===2 && currentLevel===4) checkSecret('hit');
        playerHit();
      }
    }
  }
}

function stompEnemy(e) {
  score += 100;
  spawnStompParticles(e.x+e.w/2, e.y+e.h/2);
  shake(6,3);
  e.dying=true; e.dyingTimer=22; e.vy=-5; e.vx=(Math.random()-0.5)*5;
  // Stomp combo secret (Q1-L5): 3 stomps without touching ground
  secretStompCombo++;
  if (currentQuest===1 && currentLevel===4 && secretStompCombo>=3) checkSecret('stomp3');
  if (currentQuest===3 && currentLevel===3 && secretStompCombo>=5) checkSecret('stomp5');
  // Kill count (Q2-L3)
  secretKillCount++;
  updateUI();
}

function killByFireball(e, x, y) {
  score += 200;
  spawnFireballHit(x, y);
  shake(9,4);
  e.dying=true; e.dyingTimer=22; e.vy=-4; e.vx=(e.x<x?-4:4);
  // Fireball sharpshooter secret (Q1-L4)
  secretFireballsHit++;
  if (currentQuest===1 && currentLevel===3 && secretFireballsHit>=5) checkSecret('fireball5');
  if (currentQuest===3 && currentLevel===0 && secretFireballsHit>=8) checkSecret('fireball8');
  secretKillCount++;
  updateUI();
}

// ─── BOSS LOGIC ───────────────────────────────────────────────────────────────
function updateBoss() {
  if (!boss || !boss.alive) return;
  const b = boss;
  if (b.invincible > 0) b.invincible--;
  if (b.hurtFlash > 0) b.hurtFlash--;
  b.wobble += 0.05;
  b.phaseTimer--;
  b.shootTimer--;

  // Boss AI phases
  if (b.phase === 0) {
    // Patrol: fly back and forth
    b.x += b.vx;
    b.y += Math.sin(b.wobble*2)*1.2;
    if (b.x < 60 || b.x + b.w > levelW - 60) b.vx *= -1;
    if (b.phaseTimer <= 0) {
      b.phase = Math.random() < 0.5 ? 1 : 2;
      b.phaseTimer = 80 + Math.floor(Math.random()*60);
    }
    // Shoot occasionally in patrol
    if (b.shootTimer <= 0) {
      bossShoot();
      b.shootTimer = 60 + Math.floor(Math.random()*40);
    }
  } else if (b.phase === 1) {
    // Dive: swoop toward player
    const tx = player.x - b.w/2;
    const ty = player.y - 20;
    b.x += (tx - b.x) * 0.04;
    b.y += (ty - b.y) * 0.04;
    if (b.phaseTimer <= 0) { b.phase = 0; b.phaseTimer = 100; }
  } else if (b.phase === 2) {
    // Shoot barrage
    b.x += b.vx * 0.5;
    b.y += Math.sin(b.wobble)*0.8;
    if (b.x < 60 || b.x + b.w > levelW - 60) b.vx *= -1;
    if (b.shootTimer <= 0) {
      bossShoot();
      bossShoot2();
      b.shootTimer = 28;
    }
    if (b.phaseTimer <= 0) { b.phase = 0; b.phaseTimer = 120; }
  }

  // Clamp
  b.x = Math.max(20, Math.min(b.x, levelW - b.w - 20));
  b.y = Math.max(80, Math.min(b.y, 330));

  // Boss projectiles
  for (let i = b.projectiles.length-1; i >= 0; i--) {
    const proj = b.projectiles[i];
    proj.x += proj.vx;
    proj.y += proj.vy;
    proj.vy += 0.12;
    proj.life--;
    if (proj.life <= 0 || proj.y > H+40) { b.projectiles.splice(i,1); continue; }
    // Hit player
    if (player.alive && player.invincible===0) {
      const pr = {x:proj.x-8,y:proj.y-8,w:16,h:16};
      if (overlap(player, pr)) { playerHit(); b.projectiles.splice(i,1); }
    }
  }

  // Player touches boss body
  if (player.alive && player.invincible===0) {
    const bRect = {x:b.x,y:b.y,w:b.w,h:b.h};
    if (overlap(player, bRect)) {
      const fromAbove = player.vy > 0 && (player.y+player.h) < (b.y + b.h*0.4);
      if (fromAbove && b.invincible===0) {
        hitBoss();
        player.vy = -9;
      } else if (!fromAbove) {
        playerHit();
      }
    }
  }

  // Fireballs hit boss
  for (let i = fireballs.length-1; i >= 0; i--) {
    const fb = fireballs[i];
    if (!fb.alive) continue;
    const br = {x:b.x,y:b.y,w:b.w,h:b.h};
    const fr = {x:fb.x-9,y:fb.y-9,w:18,h:18};
    if (overlap(fr, br) && b.invincible===0) {
      hitBoss();
      spawnFireballHit(fb.x, fb.y);
      fb.alive = false;
    }
  }
}

function bossShoot() {
  const b = boss;
  const angle = Math.atan2(player.y - (b.y+b.h/2), player.x - (b.x+b.w/2));
  const s = b.type==='fists' ? 4.5 : 3.5;
  b.projectiles.push({x:b.x+b.w/2, y:b.y+b.h/2, vx:Math.cos(angle)*s, vy:Math.sin(angle)*s, life:180, hue:Math.random()*360, spin:0});
}

function bossShoot2() {
  const b = boss;
  // Spread shot
  for (let a = 0; a < Math.PI*2; a += Math.PI/3) {
    b.projectiles.push({x:b.x+b.w/2, y:b.y+b.h/2, vx:Math.cos(a)*2.5, vy:Math.sin(a)*2.5, life:120, hue:Math.random()*360});
  }
}

function hitBoss() {
  const b = boss;
  b.hp--;
  b.invincible = 45;
  b.hurtFlash = 20;
  shake(14, 7);
  spawnBossHit(b.x+b.w/2, b.y+b.h/2);
  score += 500;
  updateUI();
  updateBossHealthBar();
  if (b.hp <= 0) {
    b.alive = false;
    for (let i=0;i<5;i++) {
      setTimeout(()=>{
        spawnBossHit(b.x+Math.random()*b.w, b.y+Math.random()*b.h);
        shake(10,8);
      }, i*150);
    }
    setTimeout(()=>{
      score += 2000; updateUI();
      document.getElementById('boss-health-bar').style.display='none';
      if (currentQuest === 1) {
        gameState = 'quest2intro';
        showMsg('QUEST 2 BEGINS!', `DR. EGGBOT DEFEATED! KEEP GOING — PRESS SPACE`);
      } else if (currentQuest === 2) {
        gameState = 'quest3intro';
        showMsg('QUEST 3 UNLOCKED!', `A NEW HERO RISES... PLAY AS MILES — PRESS SPACE`);
      } else {
        // Q3 - Fists defeated → happy ending
        gameState = 'ending';
        endingStep = 0;
        showMsg('', '');
        document.getElementById('message-overlay').style.display='none';
      }
    }, 900);
  }
}

// ─── UPDATE FIREBALLS ─────────────────────────────────────────────────────────
function updateFireballs() {
  for (let i=fireballs.length-1; i>=0; i--) {
    const fb = fireballs[i];
    if (!fb.alive) { fireballs.splice(i,1); continue; }

    fb.trail.push({x:fb.x, y:fb.y});
    if (fb.trail.length>7) fb.trail.shift();

    fb.vy = Math.min(fb.vy + GRAVITY*0.55, 12);
    fb.x += fb.vx;
    fb.y += fb.vy;

    for (const p of platforms) {
      const r={x:fb.x-7,y:fb.y-7,w:14,h:14};
      if (overlap(r,p)) {
        if (fb.bounces>0) {
          fb.vy = -Math.abs(fb.vy)*0.65 - 2.5;
          fb.y = p.y-7;
          fb.bounces--;
        } else {
          spawnFireballHit(fb.x, fb.y);
          fb.alive=false;
        }
        break;
      }
    }
    if (!fb.alive) continue;
    if (fb.x<cameraX-80 || fb.x>cameraX+W+80 || fb.y>H+80) { fb.alive=false; continue; }

    for (const e of enemies) {
      if (!e.alive||e.dying) continue;
      const r={x:fb.x-9,y:fb.y-9,w:18,h:18};
      if (overlap(r,e)) { killByFireball(e,fb.x,fb.y); fb.alive=false; break; }
    }
  }
}

let secretUsed = false;

// ── Secret stat trackers ──
let secretStompCombo   = 0;
let secretFireballsHit = 0;
let secretJumpCount    = 0;
let secretStillTimer   = 0;
let secretKillCount    = 0;
let secretGroundTouched= false; // for neverland (Q3-L2)
let secretGotHit       = false; // for nohit (Q3-L5)

function resetSecretTrackers() {
  secretStompCombo    = 0;
  secretFireballsHit  = 0;
  secretJumpCount     = 0;
  secretStillTimer    = 0;
  secretKillCount     = 0;
  secretGroundTouched = false;
  secretGotHit        = false;
}

function updateSecretTrackers() {
  if (secretUsed || getLevelSet()[currentLevel].isBoss) return;

  // ALL Q*-L1: jump into left wall → next quest
  if (currentLevel===0) {
    if (player.x <= 0 && !player.onGround && player.vy < 0) {
      checkSecret('leftwall');
    }
  }

  // Q1-L2: stand still 5s
  if (currentQuest===1 && currentLevel===1) {
    if (player.vx===0 && player.onGround && player.invincible===0) {
      secretStillTimer++;
      if (secretStillTimer >= 300) checkSecret('standstill');
    } else { secretStillTimer = 0; }
  }

  // Q2-L4: reach far wall — check at levelW-10 so it doesn't clash with goal
  if (currentQuest===2 && currentLevel===3) {
    if (player.x + player.w >= levelW - 10) checkSecret('farwall');
  }

  // Q2-L3: kill all enemies
  if (currentQuest===2 && currentLevel===2) {
    const alive = enemies.filter(e=>e.alive && !e.dying).length;
    if (alive === 0 && enemies.length > 0) checkSecret('killall');
  }

  // Q3-L2: neverland — only penalise touching the main floor (y >= 415), not platforms
  if (currentQuest===3 && currentLevel===1) {
    if (player.onGround && player.y + player.h >= 415 && player.x > 120) secretGroundTouched = true;
    if (player.x + player.w >= levelW - 60 && !secretGroundTouched) checkSecret('neverland');
  }

  // Q3-L4: stomp5 — 5 consecutive aerial stomps
  if (currentQuest===3 && currentLevel===3) {
    if (secretStompCombo >= 5) checkSecret('stomp5');
  }

  // Q3-L5: nohit — reach far wall without being hit
  if (currentQuest===3 && currentLevel===4) {
    if (player.x + player.w >= levelW - 60 && !secretGotHit) checkSecret('nohit');
  }
}

function checkSecret(trigger) {
  if (secretUsed) return false;
  if (getLevelSet()[currentLevel].isBoss) return false;
  const s = SECRETS.find(s =>
    s.quest === currentQuest &&
    s.level === currentLevel &&
    s.trigger === trigger
  );
  if (!s) return false;
  secretUsed = true;
  activateSecret(s);
  return true;
}

function activateSecret(s) {
  shake(20, 10);
  for (let i = 0; i < 60; i++) {
    const a = Math.random()*Math.PI*2, sp = 3+Math.random()*10;
    particles.push({
      x: player.x+player.w/2, y: player.y+player.h/2,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-3,
      life:60, maxLife:60,
      color:`hsl(${Math.random()*360},100%,65%)`,
      size:3+Math.random()*6
    });
  }
  setTimeout(() => {
    currentQuest = s.dest.quest;
    currentLevel = s.dest.level;
    currentCharacter = s.dest.quest === 3 ? 'miles' : 'rook';
    hasPower = false;
    q3StoryStep = 0;
    document.getElementById('power-display').style.display='none';
    secretUsed = false;
    updateUI();
    if (s.dest.quest === 3 && s.dest.level === 0) {
      gameState = 'quest3intro';
    } else {
      loadLevel(currentLevel);
      gameState = 'playing';
      showSecretBanner(s.msg);
    }
  }, 600);
  gameState = 'secretwarp';
}

let secretBannerTimer = 0;
let secretBannerText = '';
function showSecretBanner(msg) {
  secretBannerText = msg;
  secretBannerTimer = 200;
}

function drawSecretBanner() {
  if (secretBannerTimer <= 0) return;
  const alpha = Math.min(1, secretBannerTimer/30);
  const t = Date.now()/1000;
  ctx.save();
  ctx.globalAlpha = alpha;
  const grad = ctx.createLinearGradient(0, H/2-36, W, H/2+36);
  grad.addColorStop(0,   `hsla(${(t*80)%360},100%,30%,0.85)`);
  grad.addColorStop(0.33,`hsla(${(t*80+120)%360},100%,30%,0.85)`);
  grad.addColorStop(0.66,`hsla(${(t*80+240)%360},100%,30%,0.85)`);
  grad.addColorStop(1,   `hsla(${(t*80)%360},100%,30%,0.85)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, H/2-36, W, 72);
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffee00';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 18;
  ctx.fillText('✦ ' + secretBannerText + ' ✦', W/2, H/2+10);
  ctx.shadowBlur = 0;
  ctx.restore();
  secretBannerTimer--;
}

function drawSecretHints() {
  let hint = '';
  if (!secretUsed) {
    if (currentQuest===1 && currentLevel===1 && secretStillTimer>0) {
      hint = `🤫 stand still... ${Math.max(0,Math.floor((300-secretStillTimer)/60))}s`;
    } else if (currentQuest===1 && currentLevel===3 && hasPower && secretFireballsHit>0) {
      hint = `🔥 fireball hits: ${secretFireballsHit}/5`;
    } else if (currentQuest===1 && currentLevel===4 && secretStompCombo>0) {
      hint = `👟 stomp combo: ${secretStompCombo}/3`;
    } else if (currentQuest===2 && currentLevel===1 && secretJumpCount>0) {
      hint = `🦘 jumps: ${secretJumpCount}/15`;
    } else if (currentQuest===2 && currentLevel===2) {
      hint = `💀 enemies left: ${enemies.filter(e=>e.alive&&!e.dying).length}`;
    } else if (currentQuest===3 && currentLevel===0 && hasPower && secretFireballsHit>0) {
      hint = `🦊 fox fire: ${secretFireballsHit}/8`;
    } else if (currentQuest===3 && currentLevel===1 && !secretUsed) {
      hint = secretGroundTouched ? `❌ floor touched — secret lost` : `🪂 don't touch the floor!`;
    } else if (currentQuest===3 && currentLevel===3 && secretStompCombo>0) {
      hint = `👟 stomp chain: ${secretStompCombo}/5`;
    } else if (currentQuest===3 && currentLevel===4 && !secretUsed) {
      hint = secretGotHit ? `❌ got hit — flawless lost` : `🛡 no hits yet — stay clean!`;
    }
  }
  if (!hint) return;
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(W-230, 8, 222, 24);
  ctx.fillStyle = '#ffee88';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(hint, W-10, 25);
  ctx.textAlign = 'left';
  ctx.restore();
}

// ─── PLAYER DAMAGE ────────────────────────────────────────────────────────────
function playerHit() {
  if (player.invincible>0) return;
  // Track for Q3-L5 flawless secret
  if (currentQuest===3 && currentLevel===4) secretGotHit = true;
  lives--;
  shake(14,6);
  spawnHitParticles(player.x+player.w/2, player.y+player.h/2);
  if (lives<=0) { triggerGameOver(); return; }
  player.invincible=90;
  player.vy=-7; player.vx=player.facing*-3;
  updateUI();
}

function playerFallDie() {
  // Check for fall-triggered secret (and any-trigger) before deducting life
  if (checkSecret('fall')) return;
  lives--;
  shake(10,5);
  if (lives<=0) { triggerGameOver(); return; }
  player.x=60; player.y=350; player.vx=0; player.vy=0;
  player.invincible=90;
  cameraX=0;
  updateUI();
}

function triggerGameOver() {
  gameState='gameover';
  document.getElementById('boss-health-bar').style.display='none';
  showMsg('GAME OVER','PRESS SPACE TO RETRY');
}

function updatePowerUp() {
  if (!powerUp||powerUp.collected) return;
  const r={x:powerUp.x-14,y:powerUp.y-14,w:28,h:28};

    hasPower=true; powerUp.collected=true;
    shake(12,4);
    for (let i=0;i<28;i++) {
      const a=Math.random()*Math.PI*2, s=2+Math.random()*6;
      particles.push({x:powerUp.x,y:powerUp.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
        life:45,maxLife:45,color:`hsl(${Math.random()*360},100%,${55+Math.random()*30}%)`,size:2+Math.random()*4});
    }
    document.getElementById('power-display').style.display='block';
    updateUI();

// ─── HEART PICKUP ─────────────────────────────────────────────────────────────
function updateHeart() {
  if (!heartPickup || heartPickup.collected) return;
  const r = {x:heartPickup.x-14, y:heartPickup.y-14, w:28, h:28};
  if (player.alive && overlap(player, r)) {
    heartPickup.collected = true;
    if (lives < 3) lives++;
    shake(10, 4);
    for (let i = 0; i < 24; i++) {
      const a = Math.random()*Math.PI*2, s = 2+Math.random()*6;
      particles.push({x:heartPickup.x, y:heartPickup.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2,
        life:45, maxLife:45, color:`hsl(${340+Math.random()*30},100%,${60+Math.random()*25}%)`, size:2+Math.random()*4});
    }
    updateUI();
  }
}

function drawHeart() {
  if (!heartPickup || heartPickup.collected) return;
  const sx = heartPickup.x - cameraX;
  if (sx < -50 || sx > W+50) return;
  const t = Date.now()/1000;
  const bob = Math.sin(t*3)*4;
  const py = heartPickup.y + bob;

  ctx.save();
  ctx.translate(sx, py);

  // Glow
  const g = ctx.createRadialGradient(0,0,0,0,0,24);
  g.addColorStop(0,'rgba(255,80,120,0.5)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(-24,-24,48,48);

  // Pulse scale
  const pulse = 1 + Math.sin(t*5)*0.08;
  ctx.scale(pulse, pulse);

  // Heart shape
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-2, 2, -10, -4, -10, -10);
  ctx.bezierCurveTo(-10, -17, 0, -17, 0, -10);
  ctx.bezierCurveTo(0, -17, 10, -17, 10, -10);
  ctx.bezierCurveTo(10, -4, 2, 2, 0, 5);
  ctx.closePath();

  const hg = ctx.createRadialGradient(-3,-8,1,-3,-8,14);
  hg.addColorStop(0,'#ff88aa');
  hg.addColorStop(0.5,'#ff2255');
  hg.addColorStop(1,'#cc0033');
  ctx.fillStyle = hg;
  ctx.fill();

  // Shine
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(-3,-11,3,2,-0.3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  // Label
  ctx.fillStyle='rgba(255,160,180,0.95)';
  ctx.font='bold 10px Courier New'; ctx.textAlign='center';
  ctx.fillText('1UP!', sx, py-20);
  ctx.textAlign='left';
}
function updateGoal() {
  if (!goal) return;
  // In boss level, goal only triggers after boss is dead
  if (getLevelSet()[currentLevel].isBoss && boss && boss.alive) return;
  const r={x:goal.x,y:goal.y-70,w:28,h:70};
  if (player.alive && overlap(player,r)) {
    score+=500; updateUI();
    const levelSet = getLevelSet();
    if (currentLevel>=levelSet.length-1) {
      if (currentQuest===1) {
        gameState='quest2intro';
        showMsg('QUEST 2 BEGINS!','ONWARD! PRESS SPACE');
      } else if (currentQuest===2) {
        gameState='quest3intro';
        showMsg('QUEST 3 UNLOCKED!','A NEW HERO RISES... PLAY AS MILES — PRESS SPACE');
      } else {
        gameState='win';
        showMsg('YOU WIN!',`FINAL SCORE: ${score}  —  PRESS SPACE`);
      }
    } else {
      gameState='levelcomplete';
      showMsg('LEVEL CLEAR!',`${levelSet[currentLevel+1].name}  —  PRESS SPACE`);
    }
  }
}

// ─── CAMERA ───────────────────────────────────────────────────────────────────
function updateCamera() {
  const target = player.x - W*0.33;
  cameraX += (target-cameraX)*0.13;
  cameraX = Math.max(0, Math.min(cameraX, levelW-W));
}

// ─── UI ───────────────────────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('level-display').textContent = currentLevel+1;
  document.getElementById('quest-display').textContent = currentQuest;
  const h=['💔','❤️','❤️❤️','❤️❤️❤️'];
  document.getElementById('lives-display').textContent = h[Math.max(0,Math.min(3,lives))];
  if (hasPower) document.getElementById('power-display').style.display='block';

function showMsg(title, sub) {
  document.getElementById('msg-title').textContent=title;
  document.getElementById('msg-sub').textContent=sub;
  document.getElementById('message-overlay').style.display='flex';
}
function hideMsg() { document.getElementById('message-overlay').style.display='none'; }

// ─── DRAW BACKGROUND ──────────────────────────────────────────────────────────
function drawBg() {
  const lvl = getLevelSet()[currentLevel];
  const hue = lvl.bgHue;
  const sat = lvl.bgSat || 30;
  const lgt = lvl.bgLight || 6;
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,`hsl(${hue},${sat}%,${lgt}%)`);
  grad.addColorStop(0.5,`hsl(${hue+20},${sat-10}%,${lgt+3}%)`);
  grad.addColorStop(1,`hsl(${hue-20},${sat}%,${lgt+2}%)`);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  const t=Date.now()/1000;

  // Colorful twinkling stars/dots
  for (let i=0;i<80;i++) {
    const sx=((i*113+17)%(levelW+W));
    const sy=(i*67+5)%H;
    const wx=(sx-cameraX*0.25+levelW+W)%W;
    const twinkle=0.3+0.7*Math.abs(Math.sin(t*0.5+i));
    const starHue=(hue+i*37)%360;
    ctx.globalAlpha=twinkle*0.7;
    ctx.fillStyle=`hsl(${starHue},100%,85%)`;
    ctx.fillRect(wx, sy, i%5===0?2:1, i%5===0?2:1);
  }
  ctx.globalAlpha=1;

  // Glowing orbs in background
  for (let i=0;i<3;i++) {
    const ox = 120+i*260 + Math.sin(t*0.4+i)*30;
    const oy = 80+i*60 + Math.sin(t*0.6+i*1.3)*20;
    const orbHue=(hue+i*80)%360;
    const g=ctx.createRadialGradient(ox,oy,0,ox,oy,120);
    g.addColorStop(0,`hsla(${orbHue},100%,60%,0.08)`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // Boss level: pulsing red danger glow
  if (getLevelSet()[currentLevel].isBoss) {
    const pulse = 0.04 + 0.03*Math.sin(t*3);
    const dg = ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,350);
    dg.addColorStop(0,`rgba(255,0,0,${pulse})`);
    dg.addColorStop(1,'transparent');
    ctx.fillStyle=dg; ctx.fillRect(0,0,W,H);
  }
}

// ─── DRAW PLATFORMS ───────────────────────────────────────────────────────────
function drawPlatforms() {
  const lvl = getLevelSet()[currentLevel];
  const [ph, ps, pl] = lvl.platformColor;
  const t = Date.now()/1000;
  platforms.forEach((p,pi)=>{
    const sx=p.x-cameraX;
    if (sx+p.w<-20||sx>W+20) return;
    const shimHue = (ph + pi*15)%360;
    if (p.h>20) {
      const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0,`hsl(${shimHue},${ps}%,${pl}%)`);
      g.addColorStop(1,`hsl(${shimHue},${ps-10}%,${pl-8}%)`);
      ctx.fillStyle=g; ctx.fillRect(sx,p.y,p.w,p.h);
      ctx.fillStyle=`hsl(${shimHue},${ps+20}%,${pl+18}%)`; ctx.fillRect(sx,p.y,p.w,3);
      ctx.fillStyle='rgba(255,255,255,0.03)';
      for (let tx=0;tx<p.w;tx+=28) ctx.fillRect(sx+tx,p.y,1,p.h);
    } else {
      const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0,`hsl(${shimHue},${ps+10}%,${pl+12}%)`);
      g.addColorStop(1,`hsl(${shimHue},${ps}%,${pl}%)`);
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.roundRect(sx,p.y,p.w,p.h,3); ctx.fill();
      // Glowing top edge
      ctx.fillStyle=`hsla(${shimHue},100%,80%,0.55)`;
      ctx.fillRect(sx+2,p.y,p.w-4,2);
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.fillRect(sx+5,p.y+p.h,p.w-10,4);
    }
  });
}

// ─── DRAW GOAL ────────────────────────────────────────────────────────────────
function drawGoal() {
  if (!goal) return;
  // In boss level, hide goal until boss is dead
  if (getLevelSet()[currentLevel].isBoss && boss && boss.alive) return;
  const sx=goal.x-cameraX;
  if (sx<-60||sx>W+60) return;
  const t=Date.now()/1000;

  ctx.fillStyle='#ffcc00'; ctx.fillRect(sx+11,goal.y-90,4,90);

  ctx.save(); ctx.translate(sx+15,goal.y-90);
  for (let i=0;i<22;i++) {
    const wave=Math.sin(t*3+i*0.5)*4;
    const h=(i*16)%360;
    ctx.fillStyle=`hsl(${h},100%,60%)`;
    ctx.fillRect(i,wave,1,16);
  }
  ctx.restore();

  const g=ctx.createRadialGradient(sx+13,goal.y,0,sx+13,goal.y,35);
  g.addColorStop(0,'rgba(255,220,80,0.4)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(sx-22,goal.y-35,70,35);

  const sy2=goal.y-93+Math.sin(t*2)*3;
  ctx.shadowColor='#ffdd44'; ctx.shadowBlur=16;
  ctx.fillStyle='#ffdd44';
  ctx.beginPath(); ctx.arc(sx+13,sy2,7,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}

// ─── DRAW POWER UP ────────────────────────────────────────────────────────────
function drawPowerUp() {
  if (!powerUp||powerUp.collected) return;
  const sx=powerUp.x-cameraX;
  if (sx<-50||sx>W+50) return;
  const t=Date.now()/1000;
  const bob=Math.sin(t*3)*4;

  const g=ctx.createRadialGradient(sx,powerUp.y+bob,0,sx,powerUp.y+bob,26);
  g.addColorStop(0,'rgba(255,160,40,0.65)');
  g.addColorStop(0.5,'rgba(255,80,0,0.3)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(sx-26,powerUp.y+bob-26,52,52);

  ctx.save(); ctx.translate(sx,powerUp.y+bob);
  ctx.strokeStyle=`hsl(${20+Math.sin(t*5)*20},100%,65%)`; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.stroke();

  const fg=ctx.createRadialGradient(0,0,0,0,0,12);
  fg.addColorStop(0,'#ffffa0'); fg.addColorStop(0.4,'#ff8020'); fg.addColorStop(1,'#cc2000');
  ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='rgba(255,255,120,0.8)';
  ctx.beginPath(); ctx.ellipse(0,-5+Math.sin(t*8)*2,4,6,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle='rgba(255,220,80,0.95)';
  ctx.font='bold 10px Courier New'; ctx.textAlign='center';
  ctx.fillText('FIREBALL!',sx,powerUp.y+bob-22);
  ctx.textAlign='left';
}

// ─── DRAW FIREBALLS ───────────────────────────────────────────────────────────
function drawFireballs() {
  fireballs.forEach(fb=>{
    if (!fb.alive) return;
    const sx=fb.x-cameraX;
    fb.trail.forEach((t2,i)=>{
      const a=(i/fb.trail.length)*0.5;
      const s=(i/fb.trail.length)*9;
      ctx.globalAlpha=a; ctx.fillStyle='#ff6010';
      ctx.beginPath(); ctx.arc(t2.x-cameraX,t2.y,s,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    const g=ctx.createRadialGradient(sx,fb.y,0,sx,fb.y,11);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.3,'#ffffa0');
    g.addColorStop(0.7,'#ff6010'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,fb.y,11,0,Math.PI*2); ctx.fill();
  });
}

// ─── DRAW ENEMY ───────────────────────────────────────────────────────────────
function drawEnemy(e) {
  if (!e.alive) return;
  const sx=e.x-cameraX;
  if (sx+e.w<-30||sx>W+30) return;
  const t=Date.now()/1000;

  ctx.save();
  ctx.translate(sx+e.w/2, e.y+e.h/2);

  if (e.dying) {
    const prog=e.dyingTimer/22;
    ctx.globalAlpha=prog;
    ctx.scale(1+(1-prog)*0.6, prog*0.8+0.1);
  }

  const bob=Math.sin(e.wobble)*2.5;
  ctx.translate(0,bob);
  const dir = e.vx>0 ? 1 : -1;

  if (currentQuest===1) drawEggEnemy(t, dir, e);
  else if (currentQuest===2) drawRobotEnemy(t, dir);
  else drawFistEnemy(t, dir);

  ctx.restore();
}

function drawEggEnemy(t, dir, e) {
  const isSecret = e && e.secret;
  // ── Tiny Egg (Eggman's minion) ──
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0,18,10,3,0,0,Math.PI*2); ctx.fill();

  // Tiny legs (scurrying)
  const legSwing = Math.sin(t*12)*6;
  ctx.strokeStyle='#cc3300'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-5,13); ctx.lineTo(-7+legSwing*0.5,20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,13); ctx.lineTo(7-legSwing*0.5,20); ctx.stroke();

  // Egg body — white with red stripe
  const eg=ctx.createRadialGradient(-3,-4,2,-3,-4,14);
  eg.addColorStop(0,'#ffffff');
  eg.addColorStop(0.6,'#eeeeee');
  eg.addColorStop(1,'#cccccc');
  ctx.fillStyle=eg;
  ctx.beginPath(); ctx.ellipse(0,2,11,14,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#aaaaaa'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.ellipse(0,2,11,14,0,0,Math.PI*2); ctx.stroke();

  // Red (or green!) horizontal stripe
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0,2,11,14,0,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = isSecret ? '#22cc44' : '#dd2222';
  ctx.fillRect(-12,4,24,6);
  ctx.restore();

  // Secret egg: pulsing green glow hint
  if (isSecret) {
    const pulse = 0.15 + 0.1*Math.sin(t*6);
    const g = ctx.createRadialGradient(0,2,0,0,2,18);
    g.addColorStop(0,`rgba(0,220,80,${pulse})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(-18,-12,36,30);
  }

  // Tiny eyes — beady, angry
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-3*dir,-4,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3*dir,-4,2.5,0,Math.PI*2); ctx.fill();
  // Angry brows
  ctx.strokeStyle='#111'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo((-3*dir)-2.5,-7.5); ctx.lineTo((-3*dir)+2.5,-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo((3*dir)-2.5,-6); ctx.lineTo((3*dir)+2.5,-7.5); ctx.stroke();
  // Eye shines
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-3*dir-0.8,-4.8,0.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3*dir-0.8,-4.8,0.8,0,Math.PI*2); ctx.fill();

  // Tiny mustache (Eggman tribute)
  ctx.fillStyle='#331100';
  ctx.beginPath(); ctx.ellipse(-4,0,3.5,1.8,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4,0,3.5,1.8,-0.2,0,Math.PI*2); ctx.fill();
}

function drawRobotEnemy(t, dir) {
  // ── Tiny Robot ──
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0,20,10,3,0,0,Math.PI*2); ctx.fill();

  // Legs (marching)
  const march = Math.sin(t*10)*5;
  ctx.fillStyle='#445566';
  ctx.beginPath(); ctx.roundRect(-7,12,5,10,1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(2,12,5,10,1); ctx.fill();
  // Feet
  ctx.fillStyle='#00aacc';
  ctx.beginPath(); ctx.roundRect(-9+march*0.3,20,8,4,1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(1-march*0.3,20,8,4,1); ctx.fill();

  // Body — boxy metal
  const bg=ctx.createLinearGradient(-9,-2,9,12);
  bg.addColorStop(0,'#667788');
  bg.addColorStop(1,'#334455');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.roundRect(-9,-2,18,14,2); ctx.fill();
  ctx.strokeStyle='#00ccff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(-9,-2,18,14,2); ctx.stroke();
  // Chest light
  ctx.fillStyle='#00ffff';
  ctx.shadowColor='#00ffff'; ctx.shadowBlur=4;
  ctx.beginPath(); ctx.arc(0,5,2.5,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Tiny arms
  ctx.fillStyle='#556677';
  ctx.beginPath(); ctx.roundRect(-13,0,5,7,1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(8,0,5,7,1); ctx.fill();

  // Head — square
  const hg=ctx.createLinearGradient(-8,-16,8,-2);
  hg.addColorStop(0,'#778899');
  hg.addColorStop(1,'#445566');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.roundRect(-8,-16,16,13,2); ctx.fill();
  ctx.strokeStyle='#00aaff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(-8,-16,16,13,2); ctx.stroke();

  // Antenna
  ctx.strokeStyle='#aaccdd'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(0,-22); ctx.stroke();
  ctx.fillStyle='#ff4444';
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=4;
  ctx.beginPath(); ctx.arc(0,-22,2,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Eyes — visor style
  ctx.fillStyle='#001122';
  ctx.beginPath(); ctx.roundRect(-6,-13,12,5,1); ctx.fill();
  // Visor glow (scan effect)
  const scan = ((t*3)%1);
  ctx.fillStyle=`rgba(255,50,50,${0.5+Math.sin(t*6)*0.3})`;
  ctx.beginPath(); ctx.roundRect(-5,-12,10,3,1); ctx.fill();
  // Scan line moving
  ctx.fillStyle='rgba(255,100,100,0.8)';
  ctx.fillRect(-5,-13+scan*4,10,1);
}

function drawFistEnemy(t, dir) {
  // ── Tiny Fists minion — little red brawler ──
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0,20,10,3,0,0,Math.PI*2); ctx.fill();

  // Stubby legs
  const stomp = Math.abs(Math.sin(t*8))*4;
  ctx.fillStyle='#7a2200';
  ctx.beginPath(); ctx.roundRect(-7,11,6,10,1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(1,11,6,10,1); ctx.fill();
  ctx.fillStyle='#551800';
  ctx.beginPath(); ctx.roundRect(-9,19+stomp*0.3,10,5,1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-1,19-stomp*0.3,10,5,1); ctx.fill();

  // Beefy body
  const bG=ctx.createLinearGradient(-10,-2,10,12);
  bG.addColorStop(0,'#ff5533'); bG.addColorStop(1,'#cc2200');
  ctx.fillStyle=bG;
  ctx.beginPath(); ctx.roundRect(-10,-2,20,14,3); ctx.fill();
  ctx.strokeStyle='#ff2200'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(-10,-2,20,14,3); ctx.stroke();

  // Tiny fists (raised!)
  const punchOffset = Math.sin(t*6+dir)*3;
  ctx.fillStyle='#cc3300';
  ctx.beginPath(); ctx.roundRect(-16,-1+punchOffset,7,7,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(9,-1-punchOffset,7,7,2); ctx.fill();
  // Knuckles
  ctx.fillStyle='#ff6644';
  for(let k=0;k<2;k++) { ctx.beginPath(); ctx.arc(-13+k*3, -1+punchOffset, 1.5, 0, Math.PI*2); ctx.fill(); }
  for(let k=0;k<2;k++) { ctx.beginPath(); ctx.arc(10+k*3, -1-punchOffset, 1.5, 0, Math.PI*2); ctx.fill(); }

  // Head (round and tough)
  const hG=ctx.createRadialGradient(-2,-13,2,-2,-13,9);
  hG.addColorStop(0,'#ff6644'); hG.addColorStop(1,'#cc2200');
  ctx.fillStyle=hG;
  ctx.beginPath(); ctx.arc(0,-12,9,0,Math.PI*2); ctx.fill();

  // Mini dreadlocks
  ctx.fillStyle='#880000';
  for(let i=-2;i<=2;i++) {
    ctx.beginPath(); ctx.moveTo(i*3,-20); ctx.lineTo(i*3-2,-27); ctx.lineTo(i*3+2,-27); ctx.closePath(); ctx.fill();
  }

  // Tiny angry eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-3*dir,-12,2.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3*dir,-12,2.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#110000';
  ctx.beginPath(); ctx.arc(-3*dir,-12,1.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3*dir,-12,1.4,0,Math.PI*2); ctx.fill();
  // Angry brows
  ctx.strokeStyle='#330000'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo((-3*dir)-2.5,-15.5); ctx.lineTo((-3*dir)+2.5,-14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo((3*dir)-2.5,-14); ctx.lineTo((3*dir)+2.5,-15.5); ctx.stroke();
}
function drawBoss() {
  if (!boss || !boss.alive) return;
  if (boss.type === 'metalRook') drawMetalRook();
  else if (boss.type === 'fists') drawFists();
  else drawEggbot();
}

function drawEggbot() {
  const b = boss;
  const sx = b.x - cameraX;
  const t = Date.now()/1000;
  const hurt = b.hurtFlash > 0;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h/2);
  if (hurt) ctx.globalAlpha = (Math.floor(b.hurtFlash/3)%2===0) ? 1 : 0.3;

  // Mech body glow
  const glow = ctx.createRadialGradient(0,10,5,0,10,55);
  glow.addColorStop(0,'rgba(255,50,50,0.25)');

  ctx.fillStyle=glow; ctx.fillRect(-55,-20,110,80);

  // Egg body
  const bodyG = ctx.createRadialGradient(-8,-5,5,-8,-5,40);
  bodyG.addColorStop(0,'#888888');
  bodyG.addColorStop(0.5,'#444455');
  bodyG.addColorStop(1,'#222233');
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,5,35,40,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ff4444'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,5,35,40,0,0,Math.PI*2); ctx.stroke();

  const winG = ctx.createRadialGradient(-5,-10,2,-5,-10,18);
  winG.addColorStop(0,'rgba(0,200,255,0.8)');
  winG.addColorStop(0.6,'rgba(0,80,160,0.7)');
  winG.addColorStop(1,'rgba(0,0,80,0.5)');
  ctx.fillStyle=winG;
  ctx.beginPath(); ctx.ellipse(-5,-10,16,14,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,220,255,0.8)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(-5,-10,16,14,0,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle='#553300';
  ctx.beginPath(); ctx.ellipse(-14,8,10,5,0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14,8,10,5,-0.3,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle='#666677'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-35,0); ctx.lineTo(-52,-10); ctx.stroke();
  ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(-52,-10,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(-52,-10,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(35,0); ctx.lineTo(52,-10); ctx.stroke();
  ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(52,-10,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(52,-10,4,0,Math.PI*2); ctx.fill();

  for (let i=-1;i<=1;i+=2) {
    ctx.fillStyle='#333344';
    ctx.beginPath(); ctx.ellipse(i*18,42,8,10,0,0,Math.PI*2); ctx.fill();
    const flame = ctx.createRadialGradient(i*18,52+Math.sin(t*12)*3,0,i*18,52,12);
    flame.addColorStop(0,'#ffffff'); flame.addColorStop(0.3,'#ffff00');
    flame.addColorStop(0.7,'#ff6600'); flame.addColorStop(1,'transparent');
    ctx.fillStyle=flame;
    ctx.beginPath(); ctx.ellipse(i*18,58+Math.sin(t*12)*3,6,14,0,0,Math.PI*2); ctx.fill();
  }

  ctx.strokeStyle='#aaaacc'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(8,-58); ctx.stroke();
  ctx.fillStyle='#ff2222'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(8,-58,4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  for (let i=0;i<BOSS_MAX_HP;i++) {
    ctx.fillStyle = i < b.hp ? '#ff4444' : '#333';

  b.projectiles.forEach(proj=>{
    const px = proj.x - cameraX;

    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,proj.y,10,0,Math.PI*2); ctx.fill();
  });
}

  // Right claw (glowing — the shooting hand)
  const cg = ctx.createRadialGradient(46,-12,0,46,-12,12);
  cg.addColorStop(0,'rgba(0,255,255,0.8)');
  cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(46,-12,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#334455';
  ctx.beginPath(); ctx.arc(46,-12,9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#00ffff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(46,-12,9,0,Math.PI*2); ctx.stroke();

  // ── HEAD (big round — same as Rook but chrome) ──
  const hg = ctx.createRadialGradient(-2,-42,3,-2,-42,18);
  hg.addColorStop(0,'#778899');
  hg.addColorStop(1,'#223344');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(0,-40,20,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#00ccff'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-40,20,0,Math.PI*2); ctx.stroke();

  // Metal quills (dark, sharp)
  ctx.fillStyle='#334455';
  ctx.beginPath(); ctx.moveTo(-6,-52); ctx.lineTo(-22,-68); ctx.lineTo(-4,-46); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-12,-42); ctx.lineTo(-28,-52); ctx.lineTo(-10,-38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-11,-33); ctx.lineTo(-24,-36); ctx.lineTo(-9,-30); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#00aaff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-6,-52); ctx.lineTo(-22,-68); ctx.lineTo(-4,-46); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12,-42); ctx.lineTo(-28,-52); ctx.lineTo(-10,-38); ctx.closePath(); ctx.stroke();

  // Face patch
  ctx.fillStyle='rgba(200,220,240,0.15)';
  ctx.beginPath(); ctx.ellipse(4,-37,11,12,0.1,0,Math.PI*2); ctx.fill();

  // Eye — glowing red (evil)
  ctx.fillStyle='#220000';
  ctx.beginPath(); ctx.ellipse(6,-40,8,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#cc0000';
  ctx.beginPath(); ctx.arc(7,-40,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff2222';
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(7,-40,3.5,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Scan line
  ctx.fillStyle='rgba(255,0,0,0.6)';
  ctx.fillRect(-2,-41+Math.sin(t*8)*5,18,1.5);

  // Angry brow
  ctx.strokeStyle='#ff2222'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(0,-48); ctx.quadraticCurveTo(7,-52,14,-47); ctx.stroke();

  // Ear / side panel
  ctx.fillStyle='#334455';
  ctx.beginPath(); ctx.ellipse(-16,-50,6,8,-0.4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#00aaff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(-16,-50,6,8,-0.4,0,Math.PI*2); ctx.stroke();

  // HP indicator dots
  for (let i=0;i<BOSS_MAX_HP;i++) {
    ctx.fillStyle = i < b.hp ? '#00ffff' : '#223344';
    ctx.shadowColor = i < b.hp ? '#00ffff' : 'transparent';
    ctx.shadowBlur = i < b.hp ? 6 : 0;
    ctx.beginPath(); ctx.arc(-25+i*10,-70,4,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;

  ctx.restore();

  // Draw projectiles (cyan electric balls)
  b.projectiles.forEach(proj=>{
    const px = proj.x - cameraX;
    const pg = ctx.createRadialGradient(px,proj.y,0,px,proj.y,12);
    pg.addColorStop(0,'#ffffff');
    pg.addColorStop(0.4,'#00ffff');
    pg.addColorStop(1,'transparent');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,proj.y,12,0,Math.PI*2); ctx.fill();
    // Electric crackle
    ctx.strokeStyle=`hsla(${180+Math.random()*40},100%,80%,0.8)`; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(px+(Math.random()-0.5)*10, proj.y+(Math.random()-0.5)*10);
    ctx.lineTo(px+(Math.random()-0.5)*16, proj.y+(Math.random()-0.5)*16);
    ctx.stroke();
  });
}

// ─── DRAW PLAYER ─────────────────────────────────────────────────────────────
function drawPlayer() {
  if (currentCharacter === 'miles') { drawMiles(); return; }
  drawRook();
}

function drawRook() {
  if (!player.alive) return;
  const sx=player.x-cameraX;
  const t=Date.now()/1000;
  const isRunning = Math.abs(player.vx) > 0.5 && player.onGround;
  const legSwing = Math.sin(player.walkFrame*Math.PI/2)*10;

  ctx.save();
  ctx.translate(sx+player.w/2, player.y+player.h/2);
  ctx.scale(player.facing, 1);

  if (player.invincible>0 && Math.floor(player.invincible/4)%2===0) ctx.globalAlpha=0.35;

  // Shadow
  const sh=ctx.createRadialGradient(0,player.h/2+1,0,0,player.h/2+1,18);
  sh.addColorStop(0,'rgba(0,0,0,0.32)'); sh.addColorStop(1,'transparent');
  ctx.fillStyle=sh; ctx.fillRect(-18,8,36,12);

  // Speed lines when running
  if (isRunning) {
    const prevAlpha = (player.invincible>0 && Math.floor(player.invincible/4)%2===0) ? 0.35 : 1;
    ctx.globalAlpha = prevAlpha * 0.22;
    for(let i=0;i<4;i++){
      const ly = -8+i*7;
      const llen = 10+i*4;
      const lhue = (i*60+t*80)%360;
      ctx.strokeStyle=`hsl(${lhue},100%,70%)`;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-14-llen, ly); ctx.lineTo(-14,ly); ctx.stroke();
    }
    ctx.globalAlpha = prevAlpha;
  }

  // ── LEGS & SHOES ──
  if (!player.onGround) {
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath(); ctx.roundRect(-9,7,8,10,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(1,7,8,10,2); ctx.fill();
    ctx.fillStyle='#e02020';
    ctx.beginPath(); ctx.roundRect(-12,16,11,6,3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(1,16,11,6,3); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillRect(-11,18,9,2); ctx.fillRect(2,18,9,2);
  } else {
    ctx.save(); ctx.translate(-4,7); ctx.rotate(legSwing*0.06);
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath(); ctx.roundRect(-4,0,8,12,2); ctx.fill();
    ctx.fillStyle='#e02020';
    ctx.beginPath(); ctx.roundRect(-6,11,13,6,3); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(-5,13,11,2);
    ctx.restore();
    ctx.save(); ctx.translate(4,7); ctx.rotate(-legSwing*0.06);
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath(); ctx.roundRect(-4,0,8,12,2); ctx.fill();
    ctx.fillStyle='#e02020';
    ctx.beginPath(); ctx.roundRect(-6,11,13,6,3); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(-5,13,11,2);
    ctx.restore();
  }

  // ── BODY ──
  const bodyGrad=ctx.createLinearGradient(-9,-12,9,8);
  bodyGrad.addColorStop(0,'#1a9aff');
  bodyGrad.addColorStop(1,'#0055cc');
  ctx.fillStyle=bodyGrad;
  ctx.beginPath(); ctx.ellipse(0,-3,9,11,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(180,220,255,0.55)';
  ctx.beginPath(); ctx.ellipse(1,-1,5,7,0,0,Math.PI*2); ctx.fill();

  // ── ARM ──
  ctx.fillStyle='#1a9aff';
  ctx.beginPath(); ctx.ellipse(10,-5,4,3,0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(13,-5,4,0,Math.PI*2); ctx.fill();

  // ── HEAD ──
  const headGrad=ctx.createRadialGradient(-2,-24,2,-2,-24,16);
  headGrad.addColorStop(0,'#1a9aff');
  headGrad.addColorStop(1,'#0055cc');
  ctx.fillStyle=headGrad;
  ctx.beginPath(); ctx.arc(0,-22,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,235,210,0.92)';
  ctx.beginPath(); ctx.ellipse(3,-19,9,10,0.1,0,Math.PI*2); ctx.fill();

  // ── SPIKY QUILLS ──
  ctx.fillStyle='#0044aa';
  ctx.beginPath(); ctx.moveTo(-6,-30); ctx.lineTo(-18,-42); ctx.lineTo(-4,-26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10,-22); ctx.lineTo(-22,-30); ctx.lineTo(-8,-18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-9,-15); ctx.lineTo(-20,-18); ctx.lineTo(-7,-12); ctx.closePath(); ctx.fill();

  // ── EYE ──
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(5,-22,7,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#22cc44';
  ctx.beginPath(); ctx.arc(6,-22,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#001a00';
  ctx.beginPath(); ctx.arc(6.5,-22,2.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(7.5,-23.5,1.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8a6000';
  ctx.beginPath();
  ctx.moveTo(0,-28); ctx.quadraticCurveTo(6,-32,13,-27);
  ctx.lineWidth=2.5; ctx.strokeStyle='#8a6000'; ctx.stroke();

  // ── NOSE ──
  ctx.fillStyle='#1a1a3a';
  ctx.beginPath(); ctx.arc(12,-19,2.2,0,Math.PI*2); ctx.fill();

  // ── EAR ──
  ctx.fillStyle='#0055cc';
  ctx.beginPath(); ctx.ellipse(-9,-33,5,7,-0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffaaaa';
  ctx.beginPath(); ctx.ellipse(-9,-33,2.5,4,-0.4,0,Math.PI*2); ctx.fill();

  // ── FIREBALL POWER ──
  if (hasPower) {
    const fg=ctx.createRadialGradient(13,-5,0,13,-5,9);
    fg.addColorStop(0,'#ffff80'); fg.addColorStop(0.5,'#ff8020'); fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(13,-5+Math.sin(t*8)*1.2,9,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

// ─── DRAW MILES (orange two-tailed fox) ──────────────────────────────────────
function drawMiles() {
  if (!player.alive) return;
  const sx = player.x - cameraX;
  const t = Date.now()/1000;
  const isRunning = Math.abs(player.vx) > 0.5 && player.onGround;
  const legSwing = Math.sin(player.walkFrame*Math.PI/2)*10;

  ctx.save();
  ctx.translate(sx+player.w/2, player.y+player.h/2);
  ctx.scale(player.facing, 1);
  if (player.invincible>0 && Math.floor(player.invincible/4)%2===0) ctx.globalAlpha=0.35;

  // Shadow
  const sh=ctx.createRadialGradient(0,player.h/2+1,0,0,player.h/2+1,18);
  sh.addColorStop(0,'rgba(0,0,0,0.32)'); sh.addColorStop(1,'transparent');
  ctx.fillStyle=sh; ctx.fillRect(-18,8,36,12);

  // TWIN TAILS spinning behind (signature!)
  const tailSpin = t * (isRunning ? 18 : 5);
  for (let i=0;i<2;i++) {
    const ta = tailSpin + i*Math.PI;
    const tx2 = -10 + Math.cos(ta)*9;
    const ty2 = 2 + Math.sin(ta)*5;
    ctx.fillStyle = i%2===0 ? '#ff8800' : '#ffffff';
    ctx.beginPath(); ctx.ellipse(tx2, ty2, 5, 9, ta+Math.PI/2, 0, Math.PI*2); ctx.fill();
    // White tip
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(tx2+Math.cos(ta)*7, ty2+Math.sin(ta)*4, 3, 3.5, ta, 0, Math.PI*2); ctx.fill();
  }

  // Speed lines
  if (isRunning) {
    const prevA = (player.invincible>0 && Math.floor(player.invincible/4)%2===0) ? 0.35 : 1;
    ctx.globalAlpha = prevA * 0.22;
    for(let i=0;i<4;i++){
      const ly=-8+i*7, llen=10+i*4;
      ctx.strokeStyle=`hsl(${30+i*20},100%,70%)`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-14-llen,ly); ctx.lineTo(-14,ly); ctx.stroke();
    }
    ctx.globalAlpha = prevA;
  }

  // LEGS & SHOES (white shoes, Miles style)
  if (!player.onGround) {
    ctx.fillStyle='#cc5500';
    ctx.beginPath(); ctx.roundRect(-9,7,8,10,2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(1,7,8,10,2); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.roundRect(-12,16,11,6,3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(1,16,11,6,3); ctx.fill();
    ctx.fillStyle='#dddddd'; ctx.fillRect(-11,18,9,2); ctx.fillRect(2,18,9,2);
  } else {
    ctx.save(); ctx.translate(-4,7); ctx.rotate(legSwing*0.06);
    ctx.fillStyle='#cc5500';
    ctx.beginPath(); ctx.roundRect(-4,0,8,12,2); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.roundRect(-6,11,13,6,3); ctx.fill();
    ctx.fillStyle='#dddddd'; ctx.fillRect(-5,13,11,2);
    ctx.restore();
    ctx.save(); ctx.translate(4,7); ctx.rotate(-legSwing*0.06);
    ctx.fillStyle='#cc5500';
    ctx.beginPath(); ctx.roundRect(-4,0,8,12,2); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.roundRect(-6,11,13,6,3); ctx.fill();
    ctx.fillStyle='#dddddd'; ctx.fillRect(-5,13,11,2);
    ctx.restore();
  }

  // BODY (orange)
  const bodyG=ctx.createLinearGradient(-9,-12,9,8);
  bodyG.addColorStop(0,'#ff9900'); bodyG.addColorStop(1,'#cc5500');
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,-3,9,11,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,240,200,0.6)';
  ctx.beginPath(); ctx.ellipse(1,-1,5,7,0,0,Math.PI*2); ctx.fill();

  // ARM + WHITE GLOVE
  ctx.fillStyle='#ff8800';
  ctx.beginPath(); ctx.ellipse(10,-5,4,3,0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(13,-5,4,0,Math.PI*2); ctx.fill();

  // HEAD (big orange round)
  const headG=ctx.createRadialGradient(-2,-24,2,-2,-24,16);
  headG.addColorStop(0,'#ff9900'); headG.addColorStop(1,'#cc5500');
  ctx.fillStyle=headG;
  ctx.beginPath(); ctx.arc(0,-22,16,0,Math.PI*2); ctx.fill();
  // Cream face patch
  ctx.fillStyle='rgba(255,235,190,0.92)';
  ctx.beginPath(); ctx.ellipse(3,-19,9,10,0.1,0,Math.PI*2); ctx.fill();

  // FOX EARS (pointy!)
  ctx.fillStyle='#ff7700';
  ctx.beginPath(); ctx.moveTo(-10,-35); ctx.lineTo(-18,-50); ctx.lineTo(-2,-32); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4,-34); ctx.lineTo(10,-48); ctx.lineTo(16,-30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffaaaa';
  ctx.beginPath(); ctx.moveTo(-10,-36); ctx.lineTo(-16,-48); ctx.lineTo(-3,-33); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5,-35); ctx.lineTo(10,-46); ctx.lineTo(14,-31); ctx.closePath(); ctx.fill();

  // EYE (bright blue — signature Miles)
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(5,-22,7,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#0066ff';
  ctx.beginPath(); ctx.arc(6,-22,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#002288';
  ctx.beginPath(); ctx.arc(6.5,-22,2.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(7.5,-23.5,1.2,0,Math.PI*2); ctx.fill();
  // Friendly brow (not angry like Rook's)
  ctx.strokeStyle='#882200'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-28); ctx.quadraticCurveTo(6,-30,13,-26); ctx.stroke();

  // NOSE
  ctx.fillStyle='#331100';
  ctx.beginPath(); ctx.arc(12,-19,2.2,0,Math.PI*2); ctx.fill();

  // Fireball power glow
  if (hasPower) {
    const fg=ctx.createRadialGradient(13,-5,0,13,-5,9);
    fg.addColorStop(0,'#ffff80'); fg.addColorStop(0.5,'#ff8020'); fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(13,-5+Math.sin(t*8)*1.2,9,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

// ─── DRAW FISTS BOSS ─────────────────────────────────────────────────────────
function drawFists() {
  const b = boss;
  const sx = b.x - cameraX;
  const t = Date.now()/1000;
  const hurt = b.hurtFlash > 0;
  const isLastHP = b.hp <= 1;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h/2);
  if (hurt) ctx.globalAlpha = (Math.floor(b.hurtFlash/3)%2===0) ? 1 : 0.3;

  // Glow — red normally, golden on last HP (softening)
  const glowColor = isLastHP ? 'rgba(255,200,50,0.28)' : 'rgba(220,40,40,0.28)';
  const glow=ctx.createRadialGradient(0,0,5,0,0,60);
  glow.addColorStop(0,glowColor); glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow; ctx.fillRect(-60,-60,120,120);

  // LEGS (sturdy, planted)
  ctx.fillStyle='#7a3a00';
  ctx.beginPath(); ctx.roundRect(-20,30,16,24,3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(4,30,16,24,3); ctx.fill();
  ctx.fillStyle='#5a2800';
  ctx.beginPath(); ctx.roundRect(-24,50,24,8,3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(0,50,24,8,3); ctx.fill();

  // BODY (big and beefy)
  const bodyColor = isLastHP ? '#cc8820' : '#cc2222';
  const bodyG=ctx.createLinearGradient(-30,-18,30,32);
  bodyG.addColorStop(0, isLastHP ? '#ffaa40' : '#ff5555');
  bodyG.addColorStop(1, bodyColor);
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.roundRect(-30,-18,60,50,6); ctx.fill();
  ctx.strokeStyle = isLastHP ? '#ffcc44' : '#ff2222'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-30,-18,60,50,6); ctx.stroke();

  // Chest spikes / dreadlock-like details
  ctx.fillStyle = isLastHP ? '#aa6600' : '#880000';
  for(let i=-2;i<=2;i++) {
    ctx.beginPath(); ctx.moveTo(i*10,-18); ctx.lineTo(i*10-5,-30); ctx.lineTo(i*10+5,-30); ctx.closePath(); ctx.fill();
  }

  // MASSIVE FISTS (signature!)
  // Left fist raised
  ctx.fillStyle='#7a3a00';
  ctx.beginPath(); ctx.moveTo(-30,5); ctx.lineTo(-52,0); ctx.lineWidth=10; ctx.strokeStyle='#7a3a00'; ctx.stroke();
  const leftFistY = -5 + Math.sin(t*2)*8;
  const fistColor = isLastHP ? '#ddaa44' : '#cc2222';
  ctx.fillStyle=fistColor;
  ctx.beginPath(); ctx.roundRect(-68, leftFistY-14, 22, 20, 5); ctx.fill();
  ctx.strokeStyle = isLastHP ? '#ffcc44' : '#ff6666'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-68, leftFistY-14, 22, 20, 5); ctx.stroke();
  // Knuckle spikes on left
  ctx.fillStyle = isLastHP ? '#ffdd88' : '#ff8888';
  for(let k=0;k<3;k++) ctx.fillRect(-65+k*7, leftFistY-17, 5, 5);

  // Right fist
  ctx.beginPath(); ctx.moveTo(30,5); ctx.lineTo(52,0); ctx.lineWidth=10; ctx.strokeStyle='#7a3a00'; ctx.stroke();
  const rightFistY = -5 - Math.sin(t*2)*8;
  ctx.fillStyle=fistColor;
  ctx.beginPath(); ctx.roundRect(46, rightFistY-14, 22, 20, 5); ctx.fill();
  ctx.strokeStyle = isLastHP ? '#ffcc44' : '#ff6666'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(46, rightFistY-14, 22, 20, 5); ctx.stroke();
  for(let k=0;k<3;k++) ctx.fillRect(48+k*7, rightFistY-17, 5, 5);

  // HEAD (big, echidna-like)
  const headColor = isLastHP ? '#ffaa44' : '#ff4444';
  const headG=ctx.createRadialGradient(-4,-38,4,-4,-38,22);
  headG.addColorStop(0, isLastHP ? '#ffcc66' : '#ff6666');
  headG.addColorStop(1, isLastHP ? '#cc8820' : '#cc2222');
  ctx.fillStyle=headG;
  ctx.beginPath(); ctx.arc(0,-36,22,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=isLastHP?'#ffcc44':'#ff2222'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-36,22,0,Math.PI*2); ctx.stroke();

  // Dreadlock spikes (echidna!)
  const dreadColor = isLastHP ? '#996600' : '#881100';
  ctx.fillStyle=dreadColor;
  for(let i=-3;i<=3;i++) {
    ctx.beginPath(); ctx.moveTo(i*6,-56); ctx.lineTo(i*6-5,-72); ctx.lineTo(i*6+5,-72); ctx.closePath(); ctx.fill();
  }
  // Side dreadlocks
  ctx.beginPath(); ctx.moveTo(-20,-42); ctx.lineTo(-32,-55); ctx.lineTo(-20,-32); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(20,-42); ctx.lineTo(32,-55); ctx.lineTo(20,-32); ctx.closePath(); ctx.fill();

  // Eyes (fierce → soft on last HP)
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-7,-36,6,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-36,6,5,0,0,Math.PI*2); ctx.fill();
  const irisColor = isLastHP ? '#4444ff' : '#220000';
  ctx.fillStyle=irisColor;
  ctx.beginPath(); ctx.arc(-7,-36,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-36,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-6,-37,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,-37,1,0,Math.PI*2); ctx.fill();

  // Brow (angry → surprised on last HP)
  ctx.strokeStyle=isLastHP?'#663300':'#440000'; ctx.lineWidth=2.5;
  if (isLastHP) {
    // Surprised/sad brows
    ctx.beginPath(); ctx.moveTo(-13,-42); ctx.quadraticCurveTo(-7,-46,-1,-42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1,-42); ctx.quadraticCurveTo(7,-46,13,-42); ctx.stroke();
  } else {
    // Angry V brows
    ctx.beginPath(); ctx.moveTo(-13,-40); ctx.lineTo(-4,-44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13,-40); ctx.lineTo(4,-44); ctx.stroke();
  }

  // Mouth — gritting teeth → open shocked on last HP
  ctx.fillStyle=isLastHP?'#aa6600':'#330000';
  if (isLastHP) {
    ctx.beginPath(); ctx.arc(0,-26,6,0,Math.PI,false); ctx.fill();
    ctx.fillStyle='#fff';
    for(let i=-2;i<=1;i++) ctx.fillRect(i*3,-29,2,5);
  } else {
    ctx.beginPath(); ctx.rect(-8,-29,16,6); ctx.fill();
    ctx.fillStyle='#fff';
    for(let i=-2;i<=1;i++) ctx.fillRect(i*4,-28,3,5);
  }

  // HP dots
  for(let i=0;i<BOSS_MAX_HP;i++) {
    ctx.fillStyle = i < b.hp ? (isLastHP ? '#ffcc44' : '#ff4444') : '#333';
    ctx.shadowColor = i < b.hp ? (isLastHP ? '#ffcc44' : '#ff0000') : 'transparent';
    ctx.shadowBlur = i < b.hp ? 6 : 0;
    ctx.beginPath(); ctx.arc(-25+i*10,-62,4,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.restore();

  // Projectiles — rocks/boulders
  b.projectiles.forEach(proj=>{
    const px=proj.x-cameraX;
    ctx.save(); ctx.translate(px,proj.y);
    ctx.rotate(proj.spin||0);
    ctx.fillStyle='#886644';
    ctx.beginPath();
    ctx.moveTo(0,-10); ctx.lineTo(9,-4); ctx.lineTo(7,7); ctx.lineTo(-7,7); ctx.lineTo(-9,-4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#554422'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
    if (proj.spin !== undefined) proj.spin += 0.15;
  });
}

// ─── QUEST 3 STORY INTRO ─────────────────────────────────────────────────────

        ctx.beginPath(); ctx.moveTo(-4,-44); ctx.lineTo(-10,-38); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4,-44); ctx.lineTo(10,-38); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10,-44); ctx.lineTo(4,-38); ctx.stroke();
        // Sparks
        for(let i=0;i<5;i++){
          const sa=t*3+i*1.2, sr=30+i*8;
          ctx.strokeStyle=`hsl(${40+i*20},100%,70%)`; ctx.lineWidth=2;
          ctx.beginPath(); ctx.moveTo(Math.cos(sa)*sr,Math.sin(sa)*sr-20);
          ctx.lineTo(Math.cos(sa)*sr+8,Math.sin(sa)*sr-28); ctx.stroke();
        }
        ctx.restore();
        // Rook standing alone, looking into the distance
        drawMiniRook(200, 320, t, 1);
        // Lonely atmosphere — dark smoke
        for(let i=0;i<3;i++){
          ctx.fillStyle=`rgba(80,80,100,${0.08+i*0.04})`;
          ctx.beginPath(); ctx.ellipse(480+i*30, 260-i*20, 30+i*10, 20, 0, 0, Math.PI*2); ctx.fill();
        }
      }
    },
    {
      speaker: 'ROOK',
      text: '"I beat my own shadow.\nBut something still feels wrong out there."',
      subtext: 'He could sense it.\nThe world wasn\'t safe yet.',
      color: '#88ccff',
      drawScene: (t) => {
        drawMiniRook(240, 320, t, 1);
        // Thought bubble / horizon glow
        const grd = ctx.createRadialGradient(500,300,10,500,300,120);
        grd.addColorStop(0,'rgba(255,100,50,0.2)');
        grd.addColorStop(1,'transparent');
        ctx.fillStyle=grd; ctx.fillRect(0,0,W,H-180);
        // Distant silhouette of ruins
        ctx.fillStyle='rgba(60,30,20,0.6)';
        for(let i=0;i<5;i++) ctx.fillRect(350+i*50, 250+i%2*30, 30, 100-i%2*20);
      }
    },
    {
      speaker: null,
      text: 'Then — out of nowhere — a blur\nof orange and white landed beside him.',
      subtext: 'Two tails. A fox. Someone Rook\nhad never seen before.',
      color: '#ffcc88',
      drawScene: (t) => {
        drawMiniRook(180, 320, t, 1);
        // Miles landing with spin — dramatic entrance
        const bounce = Math.abs(Math.sin(t*4))*15;
        drawMiniMiles(340, 310+bounce*0.3, t, -1);
        // Landing dust
        ctx.fillStyle='rgba(255,180,80,0.15)';
        ctx.beginPath(); ctx.ellipse(370, 340, 40+bounce, 12, 0, 0, Math.PI*2); ctx.fill();

        for(let i=0;i<5;i++){

        }

      }

      subtext: '"There\'s a warrior called Fists\nwho\'s taken over the Mystic Ruins."',
      color: '#88aaff',
      drawScene: (t) => {
        drawMiniRook(180, 320, t, 1);
        drawMiniMiles(340, 315, t, -1);
        // Signal waves from ruins direction
        for(let r=1;r<=3;r++){
          ctx.strokeStyle=`rgba(255,120,80,${0.4-r*0.1})`;
          ctx.lineWidth=2; ctx.setLineDash([6,4]);
          ctx.beginPath(); ctx.arc(580,260,r*45+Math.sin(t*3)*4,Math.PI*0.6,Math.PI*1.4); ctx.stroke();
          ctx.setLineDash([]);
        }
        // Fists silhouette in the distance
        ctx.fillStyle='rgba(180,40,40,0.35)';
        ctx.beginPath(); ctx.ellipse(580,260,28,36,0,0,Math.PI*2); ctx.fill();
      }
    },
    {
      speaker: 'ROOK',
      text: '"Fists? Never heard of him.\nBut if he\'s causing trouble — I\'m in."',
      subtext: 'For the first time, Rook wasn\'t alone.',
      color: '#44ffaa',
      drawScene: (t) => {
        drawMiniRook(200, 315, t, 1);
        drawMiniMiles(320, 315, t, 1);
        // Both looking forward — friendship moment
        const pulse = 0.4+0.3*Math.sin(t*3);
        ctx.strokeStyle=`rgba(100,255,180,${pulse})`; ctx.lineWidth=2; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(245,300); ctx.lineTo(305,300); ctx.stroke();
        ctx.setLineDash([]);
        // Warm glow between them
        const grd=ctx.createRadialGradient(270,310,0,270,310,50);
        grd.addColorStop(0,`rgba(100,255,180,${pulse*0.3})`);
        grd.addColorStop(1,'transparent');
        ctx.fillStyle=grd; ctx.fillRect(220,270,100,80);
        // Speed lines ahead
        for(let i=0;i<5;i++){
          const ly=265+i*18;
          ctx.globalAlpha=0.2+0.15*Math.sin(t*5+i);
          ctx.strokeStyle=`hsl(${i*60},100%,70%)`; ctx.lineWidth=2;
          ctx.beginPath(); ctx.moveTo(400,ly); ctx.lineTo(480+i*15,ly); ctx.stroke();
        }
        ctx.globalAlpha=1;
      }
    },

      speaker: null,
      text: 'QUEST 3: FISTS\'S STRONGHOLD',
      subtext: 'Rook and Miles. Together for the first time.\nThe adventure begins...',
      color: '#ffee00',
      drawScene: (t) => {
        drawMiniRook(190, 315, t, 1);
        drawMiniMiles(310, 315, t, 1);
        // Epic title glow
        const tg=ctx.createRadialGradient(W/2,200,10,W/2,200,180);
        tg.addColorStop(0,'rgba(255,220,0,0.15)');
        tg.addColorStop(1,'transparent');
        ctx.fillStyle=tg; ctx.fillRect(0,80,W,280);
        // Stars bursting
        for(let i=0;i<12;i++){
          const sa=i*(Math.PI/6)+t*0.8;
          const sr=80+Math.sin(t*2+i)*20;
          ctx.fillStyle=`hsl(${i*30},100%,70%)`;
          ctx.globalAlpha=0.5+0.5*Math.sin(t*3+i);
          ctx.beginPath(); ctx.arc(W/2+Math.cos(sa)*sr,190+Math.sin(sa)*60,3,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
      }
    },
  ];

  const step = Math.min(q3StoryStep, panels.length-1);
  const p = panels[step];

  // Draw the scene
  p.drawScene(t);

  // Dark overlay panel at bottom
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(0, H-180, W, 180);
  ctx.strokeStyle=p.color; ctx.lineWidth=2;
  ctx.strokeRect(2, H-178, W-4, 176);

  // Speaker name
  if (p.speaker) {
    ctx.fillStyle=p.color;
    ctx.font='bold 13px Courier New'; ctx.textAlign='left';
    ctx.shadowColor=p.color; ctx.shadowBlur=10;
    ctx.fillText(`[ ${p.speaker} ]`, 30, H-152);
    ctx.shadowBlur=0;
  }

  // Main text
  ctx.fillStyle='#ffffff';
  ctx.font='bold 16px Courier New'; ctx.textAlign='left';
  p.text.split('\n').forEach((line,i) => ctx.fillText(line, 30, H-128+i*22));

  // Sub text
  ctx.fillStyle='rgba(180,200,220,0.85)';
  ctx.font='13px Courier New';
  p.subtext.split('\n').forEach((line,i) => ctx.fillText(line, 30, H-80+i*18));

  // Step dots
  for(let i=0;i<panels.length;i++) {
    ctx.fillStyle = i===step ? p.color : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(W/2 - (panels.length-1)*12 + i*24, H-14, 5, 0, Math.PI*2); ctx.fill();
  }

  // Press space
  ctx.globalAlpha=0.5+0.5*Math.sin(t*3);
  ctx.fillStyle='#aabbcc'; ctx.font='11px Courier New'; ctx.textAlign='right';
  const label = step < panels.length-1 ? '— SPACE to continue —' : '— SPACE to play —';
  ctx.fillText(label, W-20, H-14);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

  ctx.fillStyle='#0066ff'; ctx.beginPath(); ctx.arc(6,-22,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#002288'; ctx.beginPath(); ctx.arc(6.5,-22,2.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(7.5,-23.5,1.2,0,Math.PI*2); ctx.fill();
  // Legs
  ctx.fillStyle='#cc5500'; ctx.beginPath(); ctx.roundRect(-9,7,8,12,2); ctx.fill(); ctx.beginPath(); ctx.roundRect(1,7,8,12,2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(-12,17,13,6,3); ctx.fill(); ctx.beginPath(); ctx.roundRect(0,17,13,6,3); ctx.fill();
  ctx.restore();

  // ── ROOK (yellow) ──
  ctx.save(); ctx.translate(320, baseY+Math.sin(t*1.8)*4);
  ctx.scale(0.8,0.8);
  // Body
  const rBg=ctx.createLinearGradient(-9,-12,9,8); rBg.addColorStop(0,'#1a9aff'); rBg.addColorStop(1,'#0055cc');
  ctx.fillStyle=rBg; ctx.beginPath(); ctx.ellipse(0,-3,9,11,0,0,Math.PI*2); ctx.fill();
  // Head
  const rHg=ctx.createRadialGradient(-2,-24,2,-2,-24,16); rHg.addColorStop(0,'#1a9aff'); rHg.addColorStop(1,'#0055cc');
  ctx.fillStyle=rHg; ctx.beginPath(); ctx.arc(0,-22,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,235,210,0.92)'; ctx.beginPath(); ctx.ellipse(3,-19,9,10,0.1,0,Math.PI*2); ctx.fill();
  // Quills
  ctx.fillStyle='#0044aa';
  ctx.beginPath(); ctx.moveTo(-6,-30); ctx.lineTo(-18,-42); ctx.lineTo(-4,-26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10,-22); ctx.lineTo(-22,-30); ctx.lineTo(-8,-18); ctx.closePath(); ctx.fill();
  // Eye
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(5,-22,7,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#22cc44'; ctx.beginPath(); ctx.arc(6,-22,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#001a00'; ctx.beginPath(); ctx.arc(6.5,-22,2.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(7.5,-23.5,1.2,0,Math.PI*2); ctx.fill();
  // Legs
  ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.roundRect(-9,7,8,12,2); ctx.fill(); ctx.beginPath(); ctx.roundRect(1,7,8,12,2); ctx.fill();
  ctx.fillStyle='#e02020'; ctx.beginPath(); ctx.roundRect(-12,17,13,6,3); ctx.fill(); ctx.beginPath(); ctx.roundRect(0,17,13,6,3); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(-11,19,11,2); ctx.fillRect(1,19,11,2);
  ctx.restore();

  // Speech bubble / title card
  const alpha = Math.min(1, ((Date.now() % 10000)/500));
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath(); ctx.roundRect(60, 60, W-120, 90, 16); ctx.fill();
  ctx.strokeStyle=s.color; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(60, 60, W-120, 90, 16); ctx.stroke();
  ctx.fillStyle=s.color;
  ctx.font='bold 28px Courier New'; ctx.textAlign='center';
  ctx.shadowColor=s.color; ctx.shadowBlur=16;
  ctx.fillText(s.title, W/2, 102);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ccddff';
  ctx.font='13px Courier New';
  ctx.fillText(s.sub, W/2, 130);
  if (step < steps.length-1) {
    ctx.globalAlpha=0.5+0.5*Math.sin(t*3);
    ctx.fillStyle='#888899'; ctx.font='11px Courier New';
    ctx.fillText('— press SPACE to continue —', W/2, 155);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='left';
  ctx.restore();

  // Confetti rain
  for(let i=0;i<40;i++) {
    const cx=((i*173+t*60)%W);
    const cy=((i*97+t*30*(1+i%3)*0.3)%H);
    const ch=(i*37+t*50)%360;
    ctx.globalAlpha=0.7;
    ctx.fillStyle=`hsl(${ch},100%,65%)`;
    ctx.fillRect(cx,cy,4,4);
  }
  ctx.globalAlpha=1;
}
function drawStartBg() {
  const t=Date.now()/1000;
  ctx.fillStyle='#05050f'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<100;i++) {
    const x=(i*113+17)%W, y=(i*67+5)%H;
    const tw=0.3+0.7*Math.abs(Math.sin(t*0.6+i));
    const sh=(i*37)%360;
    ctx.globalAlpha=tw*0.8; ctx.fillStyle=`hsl(${sh},100%,80%)`;
    ctx.fillRect(x,y,i%5===0?2:1,i%5===0?2:1);
  }
  ctx.globalAlpha=1;
  for (let i=0;i<5;i++) {
    const gx=80+i*155+Math.sin(t*0.5+i*1.1)*30;
    const gy=200+Math.sin(t*0.7+i*2)*22;
    const gh=(i*72)%360;
    ctx.save(); ctx.translate(gx,gy); ctx.globalAlpha=0.2;
    const g=ctx.createRadialGradient(0,0,2,0,0,28);
    g.addColorStop(0,`hsla(${gh},100%,70%,0.9)`); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,18,22,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function gameLoop() {
  requestAnimationFrame(gameLoop);

  if (gameState==='start') {
    drawStartBg();
    if (consumeKey('Space')) startGame();
    return;
  }
  if (gameState==='gameover') {
    if (consumeKey('Space')) { restartGame(); }
    return;
  }
  if (gameState==='quest2intro') {
    if (consumeKey('Space')) {
      currentQuest = 2; currentLevel = 0; hasPower = false; currentCharacter = 'rook';
      document.getElementById('power-display').style.display='none';
      hideMsg(); loadLevel(0); gameState='playing'; updateUI();
    }
    return;
  }
  if (gameState==='quest3intro') {
    drawQ3Story();
    if (consumeKey('Space')) {
      q3StoryStep++;
      if (q3StoryStep > 5) {
        currentQuest = 3; currentLevel = 0; hasPower = false; currentCharacter = 'miles';
        document.getElementById('power-display').style.display='none';
        hideMsg(); loadLevel(0); gameState='playing'; q3StoryStep=0; updateUI();
      }
    }
    return;
  }
  if (gameState==='ending') {
    drawEnding();
    if (consumeKey('Space')) {
      endingStep++;
      if (endingStep > 4) { backToStart(); }
    }
    return;
  }
  if (gameState==='levelcomplete') {
    if (consumeKey('Space')) { currentLevel++; hideMsg(); loadLevel(currentLevel); gameState='playing'; }
    return;
  }
  if (gameState==='win') {
    if (consumeKey('Space')) { backToStart(); }
    return;
  }
  if (gameState==='secretwarp') {
    // keep drawing the game frozen while warp fires
    drawBg(); drawPlatforms(); drawGoal(); drawPowerUp(); drawHeart();
    drawParticles(); drawFireballs(); enemies.forEach(drawEnemy); drawBoss(); drawPlayer();
    drawSecretBanner();
    updateParticles();
    return;
  }

  updatePlayer();
  updateEnemies();
  updateBoss();
  updateFireballs();
  updatePowerUp();
  updateHeart();
  updateGoal();
  updateCamera();
  updateParticles();

  let sx2=0, sy2=0;
  if (shakeFrames>0) {
    sx2=(Math.random()-0.5)*shakeIntensity*2;
    sy2=(Math.random()-0.5)*shakeIntensity*2;
    shakeFrames--;
    if (shakeFrames===0) shakeIntensity=0;
  }
  ctx.save(); ctx.translate(sx2,sy2);

  drawBg();
  drawPlatforms();
  drawGoal();
  drawPowerUp();
  drawHeart();
  drawParticles();
  drawFireballs();
  enemies.forEach(drawEnemy);
  drawBoss();
  drawPlayer();
  drawSecretBanner();
  drawSecretHints();

  if (hasPower && player.alive && player.fireballCooldown>0) {
    const cd=player.fireballCooldown/18;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(10,H-28,90,18);
    ctx.fillStyle=`hsl(${30+cd*20},100%,52%)`; ctx.fillRect(10,H-28,90*(1-cd),18);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.font='10px Courier New'; ctx.fillText('FIREBALL [Z]',14,H-13);
  }

  ctx.restore();
}

// ─── GAME FLOW ────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('start-screen').style.display='none';
  lives=3; score=0; hasPower=false; currentLevel=0;
  document.getElementById('power-display').style.display='none';
  loadLevel(0); gameState='playing'; updateUI();
}

function restartGame() {
  lives=3; score=0; hasPower=false; currentLevel=0; currentQuest=1; currentCharacter='rook';
  document.getElementById('power-display').style.display='none';
  document.getElementById('boss-health-bar').style.display='none';
  hideMsg(); loadLevel(0); gameState='playing'; updateUI();
}

function backToStart() {
  lives=3; score=0; hasPower=false; currentLevel=0; currentQuest=1; currentCharacter='rook';
  document.getElementById('power-display').style.display='none';
  document.getElementById('boss-health-bar').style.display='none';
  hideMsg();
  document.getElementById('start-screen').style.display='flex';
  gameState='start';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('press-start-btn').addEventListener('click', startGame);
requestAnimationFrame(gameLoop);
</script>
